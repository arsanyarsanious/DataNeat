services:
  backend:
    build: ./backend
    environment:
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_UPLOAD_ROWS: ${MAX_UPLOAD_ROWS:-100000}
      MAX_UPLOAD_COLUMNS: ${MAX_UPLOAD_COLUMNS:-200}
      MAX_WORKFLOW_CELLS: ${MAX_WORKFLOW_CELLS:-0}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-0}
      AI_ASSIST_ENABLED: ${AI_ASSIST_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      GOOGLE_SIGN_IN_ENABLED: ${GOOGLE_SIGN_IN_ENABLED:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAX_ACCOUNT_FILES: ${MAX_ACCOUNT_FILES:-100}
      MAX_ACCOUNT_STORAGE_MB: ${MAX_ACCOUNT_STORAGE_MB:-1024}
      MAX_STORED_FILES: ${MAX_STORED_FILES:-1000}
    volumes:
      - dataneat-storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  dataneat-storage:
