services:
  - type: web
    name: dataneat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "2"
      - key: MAX_UPLOAD_ROWS
        value: "10000"
      - key: MAX_UPLOAD_COLUMNS
        value: "50"
      - key: CLEANING_WORKERS
        value: "1"
      - key: MAX_ACCOUNT_FILES
        value: "20"
      - key: MAX_ACCOUNT_STORAGE_MB
        value: "20"
      - key: CLOUD_STORAGE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_SIGNING_KEY
        generateValue: true
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "true"
