# Free Python backend for the existing Cloudflare frontend.
# Actual deployment still requires a connected Render account.
services:
  - type: web
    name: dataneat-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: CORS_ORIGINS
        value: https://dataneat.dataneat-9df71239.workers.dev
      - key: STORAGE_DIR
        value: /app/storage
